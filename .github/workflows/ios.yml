name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -eux
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Unit tests
        run: |
          set -eux
          # Swift Testing cases live in the TokiNoteCore package and run with the
          # selected Xcode toolchain.
          xcrun swift test --package-path ios/TokiNoteCore

  ipa:
    name: Unsigned IPA
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -eux
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Unsigned device build
        run: |
          set -eux
          chmod +x ios/scripts/unsigned-ipa.sh
          NAME="TokiNote-ios-0.3.7.ipa"
          ios/scripts/unsigned-ipa.sh "build/${NAME}"
          find ios/build -name '*.ipa' -print
          unzip -l "ios/build/${NAME}" | head -n 40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TokiNote-ios-unsigned
          path: ios/build/*.ipa
          if-no-files-found: error

name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  push:
    tags:
      - 'ios-*'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -eux
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Unit tests
        run: |
          set -eux
          # Swift Testing cases live in the TokiNoteCore package and run with the
          # selected Xcode toolchain. The app and widget are built by xcodebuild below.
          xcrun swift test --package-path ios/TokiNoteCore

      - name: Unsigned device build
        run: |
          set -eux
          chmod +x ios/scripts/unsigned-ipa.sh
          if [[ "$GITHUB_REF" == refs/tags/ios-* ]]; then
            NAME="TokiNote-${GITHUB_REF_NAME}.ipa"
          else
            NAME="TokiNote-ios-0.1.0.ipa"
          fi
          ios/scripts/unsigned-ipa.sh "build/${NAME}"
          find ios/build -name '*.ipa' -print

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TokiNote-ios-unsigned
          path: ios/build/*.ipa
          if-no-files-found: error

  release:
    name: Attach IPA to release
    if: startsWith(github.ref, 'refs/tags/ios-')
    needs: test
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: TokiNote-ios-unsigned
          path: dist

      - name: Resolve notes
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#ios-}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            printf 'TokiNote iOS %s\n' "$VERSION" > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"
          ls -l dist

      - name: Rename IPA
        run: |
          set -eux
          IPA="$(find dist -name '*.ipa' | head -n 1)"
          mv "$IPA" "dist/TokiNote-${TAG_NAME}.ipa"
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: TokiNote iOS ${{ env.VERSION_NAME }}
          body_path: ${{ env.NOTES_FILE }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: false
          files: dist/TokiNote-${{ env.TAG_NAME }}.ipa

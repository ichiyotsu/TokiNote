name: Release

# Build check (no tag, no release):
#   opens automatically on pull requests, or run this workflow manually.
# Publish an Android release by pushing a plain version tag:
#   git tag 0.3.6 && git push origin 0.3.6
# Tags prefixed windows- or ios- do not match. versionCode stays the default
# in app/build.gradle.kts (26 for 0.3.6) unless VERSION_CODE is set.

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*'
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0

      - name: Drop the local dev proxy
        run: sed -i '/^systemProp\.http\.proxy/d; /^systemProp\.https\.proxy/d' gradle.properties

      - name: Unit tests and debug APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0

      - name: Drop the local dev proxy
        run: sed -i '/^systemProp\.http\.proxy/d; /^systemProp\.https\.proxy/d' gradle.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace -x lintVitalAnalyzeRelease -x lintVitalRelease

      - name: Prepare release notes
        run: |
          NOTES=".github/release-notes/${VERSION_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "TokiNote ${VERSION_NAME}" > /tmp/notes.md
            echo "" >> /tmp/notes.md
            echo "This release contains fixes and improvements." >> /tmp/notes.md
            NOTES=/tmp/notes.md
          fi
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TokiNote ${{ env.VERSION_NAME }}
          body_path: ${{ env.NOTES_FILE }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

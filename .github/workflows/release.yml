name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" > /dev/null 2>&1 \
            || sdkmanager "platforms;android-37" "build-tools;36.0.0" > /dev/null 2>&1 \
            || true
          if [ -d "$ANDROID_HOME/platforms/android-37" ] || [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            SDK=37
          else
            SDK=36
          fi
          echo "COMPILE_SDK=$SDK" >> "$GITHUB_ENV"
          echo "TARGET_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: bash ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare release notes
        run: |
          NOTES=".github/release-notes/${VERSION_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "TokiNote ${VERSION_NAME}" > /tmp/notes.md
            echo "" >> /tmp/notes.md
            echo "This release contains fixes and improvements." >> /tmp/notes.md
            NOTES=/tmp/notes.md
          fi
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TokiNote ${{ env.VERSION_NAME }}
          body_path: ${{ env.NOTES_FILE }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

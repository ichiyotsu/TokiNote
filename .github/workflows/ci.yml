name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：不要给 setup-java 开 cache: gradle。曾经被污染的依赖缓存会让
      # Gradle 认为 AGP 插件解析失败而不去下载，表现成 "plugin not found"。
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Runner 自带的 SDK 不一定有 compileSdk 37 的平台包，这里显式安装。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/platforms"

      # runner 上 downloads.gradle.org 会拒绝连接，wrapper 拉不到 9.6.0，直接用预装 Gradle（9.8.1）。
      - name: Verify Gradle
        run: gradle --version

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokinote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：不要给 setup-java 开 cache: gradle。曾经被污染的依赖缓存会让
      # Gradle 认为 AGP 插件解析失败而不去下载，表现成 "plugin not found"。
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Runner 自带的 SDK 不一定有 compileSdk 37 的平台包，这里显式安装。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/platforms"

      # runner 上 downloads.gradle.org 会拒绝连接，wrapper 拉不到 9.6.0，直接用预装 Gradle（9.8.1）。
      - name: Verify Gradle
        run: gradle --version

      - name: Probe Google Maven
        run: |
          P="com/android/application/com.android.application.gradle.plugin/9.4.1/com.android.application.gradle.plugin-9.4.1.pom"
          code=$(curl -s -o /tmp/agp.pom -w '%{http_code}' --max-time 25 "https://dl.google.com/dl/android/maven2/$P" || true)
          echo "google GET=$code size=$(wc -c < /tmp/agp.pom 2>/dev/null || echo 0)"
          code2=$(curl -s -o /tmp/agp2.pom -w '%{http_code}' --max-time 25 "https://maven.aliyun.com/repository/google/$P" || true)
          echo "aliyun GET=$code2 size=$(wc -c < /tmp/agp2.pom 2>/dev/null || echo 0)"
          D="com/android/tools/build/gradle/9.4.1/gradle-9.4.1.pom"
          code3=$(curl -s -o /tmp/agp3.pom -w '%{http_code}' --max-time 25 "https://dl.google.com/dl/android/maven2/$D" || true)
          echo "google-impl GET=$code3 size=$(wc -c < /tmp/agp3.pom 2>/dev/null || echo 0)"
          echo "--- proxy env ---"
          env | grep -i proxy || true

      - name: Probe Maven mirror config
        run: |
          echo "--- ~/.m2 ---"
          ls -la "$HOME/.m2" 2>/dev/null || echo "no ~/.m2"
          echo "--- settings.xml ---"
          cat "$HOME/.m2/settings.xml" 2>/dev/null || echo "no settings.xml"
          echo "--- gradle properties ---"
          cat "$HOME/.gradle/gradle.properties" 2>/dev/null || echo "no gradle.properties"
          echo "--- init scripts ---"
          ls -la "$HOME/.gradle/init.d" 2>/dev/null || echo "no init.d"
          echo "--- full gradle --version ---"
          gradle --version

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace --info

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokinote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

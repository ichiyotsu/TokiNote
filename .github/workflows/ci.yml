name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" > /dev/null 2>&1 \
            || sdkmanager "platforms;android-37" "build-tools;36.0.0" > /dev/null 2>&1 \
            || true
          if [ -d "$ANDROID_HOME/platforms/android-37" ] || [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            SDK=37
          else
            SDK=36
          fi
          echo "COMPILE_SDK=$SDK" >> "$GITHUB_ENV"
          echo "TARGET_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokinote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
